<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>로드북</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* Layout: 지도 전체 화면 + 데스크톱은 왼쪽 패널, 폰은 아래쪽 시트 */
:root{
  --bg:#f3f5f4; --panel:#ffffff; --fg:#17212b; --muted:#5d6b75; --line:#dde3e1;
  --accent:#0f6e64; --accent-soft:#d9eeea; --sea:#cfe8f6; --visit:#2a9d8f; --manual:#e9a23b; --danger:#b3392f;
  --font-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{ --sea:#cfe8f6;
  --bg:#0f1519; --panel:#161e23; --fg:#e6ecea; --muted:#93a29f; --line:#2a353a;
  --accent:#4fc1b2; --accent-soft:#1d3a37; --visit:#3bb3a3; --manual:#f0b357; --danger:#ef7b70; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--font-body);overflow:hidden}
#map{position:fixed;inset:0;background:var(--sea)}
/* 바다는 지도 배경(하늘색), 육지는 흰색 국가 도형으로 직접 그림 */
.leaflet-labels-pane{pointer-events:none}
.leaflet-container{font-family:var(--font-body)}
.panel{position:fixed;z-index:1000;background:var(--panel);display:flex;flex-direction:column;
  box-shadow:0 8px 30px rgba(0,0,0,.18)}
@media (min-width:760px){.panel{top:16px;left:16px;bottom:16px;width:370px;border-radius:14px}}
@media (max-width:759px){.panel{left:0;right:0;bottom:0;max-height:52vh;border-radius:16px 16px 0 0;
  padding-bottom:env(safe-area-inset-bottom,0px)}
  .panel.collapsed .body{display:none}}
.head{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.head h1{margin:0;font-size:18px;font-weight:700;letter-spacing:-.01em}
.stats{font:12px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.head .grow{flex:1;min-width:0}
.iconbtn{border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:8px;padding:4px 10px;font:inherit;cursor:pointer}
.body{overflow-y:auto;padding:12px 16px 16px;display:flex;flex-direction:column;gap:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;color:var(--muted);padding:7px;border-radius:8px;font:500 13px var(--font-body);cursor:pointer}
.seg button.on{background:var(--panel);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.hint{font-size:12px;color:var(--muted);margin:-6px 0 0}
.label{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:transparent;color:var(--fg);
  border-radius:999px;padding:4px 11px;font:13px var(--font-body);cursor:pointer}
.chip.on{border-color:var(--fg);font-weight:700}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.trip-name{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--fg);
  font:700 16px var(--font-body);padding:4px 0}
.trip-name:focus{outline:none;border-color:var(--accent)}
.search{position:relative}
#edit-box{border-top:1px dashed var(--line);margin-top:6px;padding-top:2px}
@media (min-width:760px){
  #edit-box{position:sticky;bottom:-16px;background:var(--panel);padding-bottom:16px;z-index:5;box-shadow:0 -8px 12px -10px rgba(0,0,0,.18)}
  #edit-box .results{position:absolute;left:0;right:0;bottom:100%;margin:0 0 6px;background:var(--panel);box-shadow:0 -4px 16px rgba(0,0,0,.15)}
}
@media (max-width:759px){#edit-box .results{position:relative}}
.search input{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;padding:9px 12px;font:inherit}
.results{list-style:none;margin:6px 0 0;padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.results li button{width:100%;text-align:left;border:0;background:var(--panel);color:var(--fg);padding:8px 12px;font:inherit;cursor:pointer;border-top:1px solid var(--line)}
.results li:first-child button{border-top:0}
.results li button.act{background:var(--accent-soft)}
.search-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:12px 0 6px}
.morebtn{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:4px 12px;font:500 12px var(--font-body);cursor:pointer}
.results{max-height:300px;overflow-y:auto}
.results small{display:block;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stops{list-style:none;margin:0;padding:0}
.stop{display:flex;align-items:center;gap:10px;padding:6px 0}
.num{width:22px;height:22px;border-radius:50%;color:#fff;font:500 12px var(--font-mono);display:grid;place-items:center;flex:none}
.stop .nm{flex:1;min-width:0}
.stop .nm b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stop .nm span{font-size:12px;color:var(--muted)}
.mini{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:2px 5px;font:13px var(--font-mono);border-radius:6px}
.mini:hover{background:var(--bg);color:var(--fg)}
.leg{margin-left:10px;padding:2px 0 2px 21px;border-left:2px dotted var(--line);font:12px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.leg.road{border-left-style:solid}
.leg{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.via{border:1px solid var(--line);background:var(--panel);border-radius:999px;width:28px;height:24px;font-size:13px;line-height:1;cursor:pointer;padding:0;flex:none;display:inline-grid;place-items:center}
span.via{cursor:default}
.via.on{border-color:var(--accent);background:var(--accent-soft)}
.via-pick{flex-basis:100%;display:flex;flex-wrap:wrap;gap:6px;padding:4px 0 2px}
.via-pick .chip,.next-via .chip{padding:3px 9px;font-size:12px}
.next-via{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--muted)}
.via-ico{width:22px;height:22px;border-radius:50%;background:#fff;border:1px solid #c9d3d8;display:grid;place-items:center;font-size:12px;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.ins{margin-left:auto;border:1px dashed var(--line);background:transparent;color:var(--accent);border-radius:999px;padding:1px 9px;font:500 11px var(--font-body);cursor:pointer}
.ins.on{border-style:solid;border-color:var(--accent);background:var(--accent-soft)}
#add-label{text-transform:none;letter-spacing:0;font-size:12px}
#add-label .mini{color:var(--accent);font-size:12px}
.empty{color:var(--muted);font-size:13px;padding:8px 0}
.danger{color:var(--danger);border-color:var(--danger)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.banner{display:flex;flex-direction:column;gap:8px;align-items:flex-start;border:1px solid var(--manual);background:color-mix(in srgb,var(--manual) 14%,var(--panel));border-radius:12px;padding:10px 12px;font-size:12.5px}
.toast{position:fixed;z-index:2000;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);
  background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:13px;max-width:90vw}
.pin{width:24px;height:24px;border-radius:50%;border:2px solid #fff;color:#fff;font:500 11px var(--font-mono);
  display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.4)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.main,.detail{display:flex;flex-direction:column;gap:14px}
.d-head{display:flex;align-items:center;gap:10px}
.d-head .num{width:28px;height:28px;font-size:13px}
.d-title{flex:1;min-width:0}
.d-title b{display:block;font-size:18px;font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.d-title span{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tile{position:relative;aspect-ratio:1;max-width:100%;border-radius:8px;overflow:hidden;background:var(--bg);border:0;padding:0;cursor:pointer}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile-wrap{position:relative;aspect-ratio:1;min-width:0}
.tile-wrap .tile{width:100%;height:100%}
.tile-x{position:absolute;top:5px;right:5px;min-width:24px;height:24px;padding:0 6px;border:0;border-radius:999px;
  background:rgba(15,20,25,.62);color:#fff;font:500 15px/24px var(--font-body);cursor:pointer;opacity:.85}
.tile-x:hover,.tile-x:focus-visible{opacity:1;background:rgba(15,20,25,.82)}
.tile-x.armed{background:#c0392b;font-size:12px;opacity:1}
.tile.add{border:1.5px dashed var(--line);color:var(--accent);font:300 34px/1 var(--font-body);display:grid;place-items:center;background:transparent}
.tile.add small{display:block;font:500 11px var(--font-body);margin-top:4px}
.detail{position:relative;border-radius:12px;transition:box-shadow .15s}
.detail.dropping{box-shadow:0 0 0 2px var(--accent) inset;background:var(--accent-soft)}
.detail.dropping::after{content:"여기에 놓으면 사진이 추가돼요";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  background:var(--accent);color:#fff;padding:8px 14px;border-radius:999px;font:500 13px var(--font-body);pointer-events:none;white-space:nowrap}
.drop-hint{grid-column:1/-1;font-size:12px;color:var(--muted)}
@media (hover:none){.drop-hint{display:none}}
.tile.busy{display:grid;place-items:center;font:12px var(--font-mono);color:var(--muted)}
.tile.missing{display:grid;place-items:center;font-size:11px;color:var(--muted);padding:6px;text-align:center}
.lightbox{position:fixed;inset:0;z-index:3000;background:rgba(8,12,15,.94);display:grid;place-items:center;
  padding:calc(48px + env(safe-area-inset-top,0px)) 12px calc(64px + env(safe-area-inset-bottom,0px))}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain}
.lb-btn{position:absolute;border:0;background:rgba(255,255,255,.12);color:#fff;border-radius:999px;width:44px;height:44px;font-size:26px;cursor:pointer}
.lb-close{top:calc(10px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px))}
.lb-prev{left:calc(10px + env(safe-area-inset-left,0px));top:50%}
.lb-next{right:calc(10px + env(safe-area-inset-right,0px));top:50%}
.lb-bar{position:absolute;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;align-items:center;gap:14px;color:#cfd8dc;font:13px var(--font-mono)}
.lb-del{border:1px solid #ef7b70;background:transparent;color:#ef7b70;border-radius:8px;padding:5px 12px;font:13px var(--font-body);cursor:pointer}
.modal{position:fixed;inset:0;z-index:2500;background:rgba(8,12,15,.5);display:grid;place-items:center;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--panel);color:var(--fg);border-radius:14px;padding:16px;width:min(520px,100%);display:flex;flex-direction:column;gap:10px}
.sheet textarea{width:100%;height:180px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;padding:8px;font:11px/1.4 var(--font-mono);resize:vertical}
.pin.sel{transform:scale(1.25);box-shadow:0 0 0 3px rgba(255,255,255,.9),0 2px 8px rgba(0,0,0,.45)}
.tabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:transparent;color:var(--muted);padding:11px 8px;font:500 14px var(--font-body);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--fg);font-weight:700;border-bottom-color:var(--accent)}
.account{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;font-size:13px}
.account .note{color:var(--muted);font-size:12px}
.account input{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;padding:8px 10px;font:inherit}
.account .who{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.account .who b{font-weight:500;overflow-wrap:anywhere;min-width:0}
.sync{font:12px var(--font-mono);color:var(--muted)}
.uid{font:11px var(--font-mono);color:var(--muted);overflow-wrap:anywhere;user-select:all}
.primary{border:0;background:var(--accent);color:#fff;border-radius:8px;padding:6px 12px;font:500 13px var(--font-body);cursor:pointer}
.trip-name[readonly]{border-bottom-color:transparent}
</style>
</head>
<body>
<div id="map"></div>

<section class="panel" id="panel">
  <div class="head">
    <div class="grow">
      <h1>로드북</h1>
      <div class="stats" id="stats"></div>
    </div>
    <button class="iconbtn" id="fold" aria-label="패널 접기">접기</button>
  </div>
  <div class="tabs" role="tablist">
    <button id="tab-show" role="tab">여행 기록</button>
    <button id="tab-mine" role="tab">내 지도 만들기</button>
  </div>
  <div class="body">
    <div id="detail" class="detail" hidden>
      <div class="d-head">
        <button class="iconbtn" id="d-back">← 목록</button>
        <span class="num" id="d-num"></span>
        <div class="d-title"><b id="d-name"></b><span id="d-sub"></span></div>
      </div>
      <div class="label" id="d-count"></div>
      <div class="grid" id="d-grid"></div>
      <input type="file" id="d-file" accept="image/*" multiple hidden>
    </div>
    <div id="main" class="main">
    <div class="banner" id="route-banner" hidden>
      <span>도로 경로 서버에 연결할 수 없어서 도시 사이를 임시 곡선으로 그렸어요. Claude 앱 안의 미리보기는 외부 접속이 막혀 있어요. Netlify에 올린 주소를 사파리나 크롬으로 열면 실제 도로를 따라 그려져요.</span>
      <button class="iconbtn" id="route-retry">다시 시도</button>
    </div>
    <div class="account" id="account" hidden></div>
    <div id="mode-box" style="display:flex;flex-direction:column;gap:14px">
      <div class="seg">
        <button id="mode-route" class="on">경로 추가</button>
        <button id="mode-country">나라 표시</button>
      </div>
      <p class="hint" id="hint"></p>
    </div>

    <div>
      <div class="label">여행</div>
      <div class="chips" id="trips" style="margin-top:6px"></div>
    </div>

    <div id="trip-box">
      <input class="trip-name" id="trip-name" aria-label="여행 이름">
      <ul class="stops" id="stops" style="margin-top:10px"></ul>
      <div id="edit-box">
      <div class="search-top">
        <span class="label" id="add-label">경유지 추가</span>
        <button class="morebtn" id="more" type="button">지도에서 더 찾기</button>
      </div>
      <div class="search">
        <input id="q" placeholder="도시 이름 입력 (예: ㅍ, 파리, Kyoto)" autocomplete="off">
        <ul class="results" id="results" hidden></ul>
      </div>
      <div class="next-via">
        <span>이 도시까지</span>
        <div class="chips" id="next-via"></div>
      </div>
      </div>
      <div class="row" style="margin-top:8px">
        <button class="iconbtn" id="fit">경로 전체 보기</button>
        <button class="iconbtn danger" id="del-trip">여행 삭제</button>
      </div>
    </div>

    <div>
      <div class="label">다녀온 나라</div>
      <div class="chips" id="countries" style="margin-top:6px"></div>
    </div>
    <div id="move-box">
      <div class="label">기록 옮기기</div>
      <p class="hint" style="margin:4px 0 8px">다른 브라우저나 Claude 앱 미리보기에서 만든 지도를 여기로 가져올 수 있어요.</p>
      <div class="row"><button class="iconbtn" id="exp">내보내기</button><button class="iconbtn" id="imp">불러오기</button></div>
    </div>
    </div>
  </div>
</section>
<div class="lightbox" id="lb" hidden>
  <img id="lb-img" alt="">
  <button class="lb-btn lb-close" id="lb-close" aria-label="닫기">×</button>
  <button class="lb-btn lb-prev" id="lb-prev" aria-label="이전 사진">‹</button>
  <button class="lb-btn lb-next" id="lb-next" aria-label="다음 사진">›</button>
  <div class="lb-bar"><span id="lb-pos"></span><button class="lb-del" id="lb-del">사진 삭제</button></div>
</div>
<div class="toast" id="toast" hidden></div>
<div class="modal" id="mv" hidden>
  <div class="sheet">
    <b id="mv-title"></b>
    <p class="hint" id="mv-hint" style="margin:0"></p>
    <textarea id="mv-text" spellcheck="false"></textarea>
    <div class="row"><button class="primary" id="mv-go"></button><button class="iconbtn" id="mv-close">닫기</button></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
/* 서버 설정은 config.js 파일에 있어요 (이 파일은 기능 코드만) */
const CFG=window.ROADBOOK_CONFIG||{};
const SUPABASE_URL=CFG.SUPABASE_URL||'', SUPABASE_KEY=CFG.SUPABASE_KEY||'', OWNER_ID=CFG.OWNER_ID||'', OWNER_NAME=CFG.OWNER_NAME||'';
const COLORS=['#e4572e','#3a6ea5','#8e5ac8','#2a9d8f','#d1495b','#c98a12'];
// 무료 공개 길찾기 서버 2곳 (앞쪽이 안 되면 뒤쪽 사용)
const ROUTERS=['https://router.project-osrm.org/route/v1/driving/','https://routing.openstreetmap.de/routed-car/route/v1/driving/'];
const NOMI='https://nominatim.openstreetmap.org/';
const uid=()=>Math.random().toString(36).slice(2,9);

/* ---------- 저장 ---------- */
const KEY='roadbook-v1', LEGKEY='roadbook-legs-v1';
function load(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function saveLegs(){try{localStorage.setItem(LEGKEY,JSON.stringify(legCache))}catch(e){}}
function save(){
  saveLegs();
  if(readOnly())return;
  if(session){try{localStorage.setItem(pendKey(),JSON.stringify(myState))}catch(e){}scheduleCloud()}
  else try{localStorage.setItem(KEY,JSON.stringify(myState))}catch(e){}
}

const SAMPLE={
  trips:[
    {id:'ex1',name:'예시 · 유럽 자동차 여행',color:COLORS[0],stops:[
      {id:'a',name:'파리',country:'프랑스',lat:48.8566,lng:2.3522},
      {id:'b',name:'브뤼셀',country:'벨기에',lat:50.8467,lng:4.3525},
      {id:'c',name:'암스테르담',country:'네덜란드',lat:52.3728,lng:4.8936},
      {id:'d',name:'코펜하겐',country:'덴마크',lat:55.6761,lng:12.5683}]},
    {id:'ex2',name:'예시 · 한일 여행',color:COLORS[1],stops:[
      {id:'e',name:'서울',country:'대한민국',lat:37.5665,lng:126.978},
      {id:'f',name:'부산',country:'대한민국',lat:35.1796,lng:129.0756},
      {id:'g',name:'후쿠오카',country:'일본',lat:33.5902,lng:130.4017},
      {id:'h',name:'오사카',country:'일본',lat:34.6937,lng:135.5023}]}
  ],
  activeId:'ex1', manual:{}

const dark=matchMedia('(prefers-color-scheme: dark)').matches;

  maxZoom:19,
  attribution:'지명 &copy; Esri · 국경 Natural Earth · 경로 &copy; OpenStreetMap, OSRM'}).addTo(map);

/* 날짜변경선(±180°)을 넘는 고리는 서쪽 좌표를 +360 해서 이어 붙임 → 가로줄 방지 */
function fixRing(ring){
  let jump=false;for(let i=1;i<ring.length;i++)if(Math.abs(ring[i][0]-ring[i-1][0])>180){jump=true;break}
  return jump?ring.map(([x,y])=>[x<0?x+360:x,y]):ring}
function fixFeature(f){const g=f.geometry;if(!g||f.id==='010')return f; // 남극은 그대로
  if(g.type==='Polygon')g.coordinates=g.coordinates.map(fixRing);
  else if(g.type==='MultiPolygon')g.coordinates=g.coordinates.map(p=>p.map(fixRing));
  return f}
fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-50m.json').then(r=>r.json()).then(topo=>{
  countries=topojson.feature(topo,topo.objects.countries).features.filter(f=>f.geometry).map(fixFeature);
  countryLayer=L.geoJSON({type:'FeatureCollection',features:countries},{pane:'land',interactive:false,style:countryStyle}).addTo(map);
  render();
}).catch(()=>toast('국가 경계를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.'));

/* 점이 어느 나라 안에 있는지 (해안 도시는 가장 가까운 나라로) */
function inRing(pt,ring){let x=pt[0],y=pt[1],c=false;
  for(let i=0,j=ring.length-1;i<ring.length;j=i++){const[xi,yi]=ring[i],[xj,yj]=ring[j];
    if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))c=!c}return c}
function polys(f){return f.geometry.type==='Polygon'?[f.geometry.coordinates]:f.geometry.coordinates}
function countryAt(lat,lng){
  for(const p of [[lng,lat],[lng+360,lat]])
  for(let i=0;i<countries.length;i++)for(const poly of polys(countries[i]))
    if(inRing(p,poly[0])&&!poly.slice(1).some(h=>inRing(p,h)))return i;
  let best=-1,bd=4; // 약 2도 이내
  countries.forEach((f,i)=>polys(f).forEach(poly=>poly[0].forEach(([x,y])=>{
    const d=Math.min((x-lng)**2,(x-lng-360)**2)+(y-lat)**2; if(d<bd){bd=d;best=i}})));
  return best;
}
const ciCache={};
function visited(){
  const v=new Map();
  if(countries.length)state.trips.forEach(t=>t.stops.forEach(s=>{
    const k=s.lat+','+s.lng;if(ciCache[k]===undefined)ciCache[k]=countryAt(s.lat,s.lng);const ci=ciCache[k];
    if(ci>=0&&!v.has(ci))v.set(ci,{name:s.country||countries[ci].properties.name,auto:true})}));
  for(const[k,name]of Object.entries(state.manual)){const i=+k;if(!v.has(i))v.set(i,{name,auto:false})}
  return v;
}
function countryStyle(f){
  const v=visitedCache.get(countries.indexOf(f));
  if(!v)return{stroke:true,color:'#c3ccd2',weight:.7,fillColor:'#ffffff',fillOpacity:1};
  return v.auto?{stroke:true,color:'#2a9d8f',weight:1.2,fillColor:'#c4e7e0',fillOpacity:1}
               :{stroke:true,color:'#d9902a',weight:1.2,fillColor:'#f8e2b8',fillOpacity:1};
}
let visitedCache=new Map();

/* ---------- 경로 계산 ---------- */
const legKey=(a,b)=>`${a.lat.toFixed(4)},${a.lng.toFixed(4)};${b.lat.toFixed(4)},${b.lng.toFixed(4)}`;
function haversine(a,b){const R=6371,t=Math.PI/180,dl=(b.lat-a.lat)*t,dn=(b.lng-a.lng)*t;
  const h=Math.sin(dl/2)**2+Math.cos(a.lat*t)*Math.cos(b.lat*t)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function arc(a,b){ // 대권 곡선
  const t=Math.PI/180,f1=a.lat*t,l1=a.lng*t,f2=b.lat*t,l2=b.lng*t;
  const d=haversine(a,b)/6371; if(d<1e-6)return[[a.lat,a.lng],[b.lat,b.lng]];
  const out=[];let prev=null;
  for(let i=0;i<=48;i++){const k=i/48,A=Math.sin((1-k)*d)/Math.sin(d),B=Math.sin(k*d)/Math.sin(d);
    const x=A*Math.cos(f1)*Math.cos(l1)+B*Math.cos(f2)*Math.cos(l2),y=A*Math.cos(f1)*Math.sin(l1)+B*Math.cos(f2)*Math.sin(l2),z=A*Math.sin(f1)+B*Math.sin(f2);
    let lat=Math.atan2(z,Math.hypot(x,y))/t,lng=Math.atan2(y,x)/t;
    if(prev!==null){while(lng-prev>180)lng-=360;while(lng-prev<-180)lng+=360}prev=lng;out.push([lat,lng])}
  return out;
}
/* 이동 수단: 도착하는 도시(stop.via)에 저장. 자동차만 실제 도로 경로를 받아옴 */
const VIA={car:{ico:'🚗',name:'자동차',dash:null},plane:{ico:'✈️',name:'비행기',dash:'1 8',bend:.22},
  ship:{ico:'⛴️',name:'배',dash:'9 7',bend:.12},train:{ico:'🚆',name:'기차',dash:'14 5 3 5',bend:.06}};
const viaOf=s=>VIA[s&&s.via]?s.via:'car';
let nextVia='car', legEdit=null;
function bend(a,b,k){ // 두 도시 사이를 옆으로 휘어진 곡선으로
  let bl=b.lng;while(bl-a.lng>180)bl-=360;while(bl-a.lng<-180)bl+=360;
  const dx=bl-a.lng,dy=b.lat-a.lat,mx=(a.lng+bl)/2,my=(a.lat+b.lat)/2,cx=mx-dy*k,cy=my+dx*k,out=[];
  for(let i=0;i<=40;i++){const t=i/40,u=1-t;out.push([u*u*a.lat+2*u*t*cy+t*t*b.lat,u*u*a.lng+2*u*t*cx+t*t*bl])}
  return out}
const queue=[];let busy=false,routeOffline=false;const legFail={};
function needLeg(a,b){const k=legKey(a,b);
  if(legCache[k]||legFail[k]||routeOffline||queue.some(q=>q.k===k))return;queue.push({k,a,b});pump()}
async function askRouter(base,a,b){
  const long=haversine(a,b)>500;
  const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),25000);
  try{const r=await fetch(`${base}${a.lng},${a.lat};${b.lng},${b.lat}?overview=${long?'simplified':'full'}&geometries=geojson`,{signal:ctl.signal});
    return await r.json()}finally{clearTimeout(tm)}}
function retryRoutes(){routeOffline=false;for(const k in legFail)delete legFail[k];render()}
async function pump(){
  if(busy||!queue.length)return;busy=true;const{k,a,b}=queue.shift();
  let j=null,netErr=0;
  for(const base of ROUTERS){
    try{j=await askRouter(base,a,b);if(j&&(j.code==='Ok'||j.code==='NoRoute'||j.code==='NoSegment'))break}
    catch(e){if(e.name==='TypeError')netErr++;j=null}}
  try{
    if(!j){if(netErr===ROUTERS.length){routeOffline=true;queue.length=0;render()}else{legFail[k]=true;render()}return}
    if(j.code==='Ok'&&j.routes&&j.routes[0]){const rt=j.routes[0];
      legCache[k]={type:'road',km:rt.distance/1000,min:rt.duration/60,
        pts:rt.geometry.coordinates.map(([x,y])=>[+y.toFixed(5),+x.toFixed(5)])};
    }else if(j.code==='NoRoute'||j.code==='NoSegment'){legCache[k]={type:'line',km:haversine(a,b)}}
    else{legFail[k]=true;render();return}
    saveLegs();render();
  }finally{busy=false;setTimeout(pump,400)}
}

/* ---------- 그리기 ---------- */
const fmtKm=k=>Math.round(k).toLocaleString('ko-KR')+'km';
const fmtMin=m=>{const h=Math.floor(m/60),mm=Math.round(m%60);return h?`${h}시간 ${mm}분`:`${mm}분`};
function drawMap(){
  routeLayer.clearLayers();markerLayer.clearLayers();
  state.trips.forEach(t=>{
    const isA=t.id===state.activeId, op=isA?1:.45;
    for(let i=1;i<t.stops.length;i++){const a=t.stops[i-1],b=t.stops[i],v=viaOf(b);
      if(v==='car'){const leg=legCache[legKey(a,b)];if(!leg)needLeg(a,b);
        if(leg&&leg.type==='road')L.polyline(leg.pts,{color:t.color,weight:isA?4.5:3,opacity:op}).addTo(routeLayer);
        else L.polyline(arc(a,b),{color:t.color,weight:isA?3:2,opacity:op,dashArray:'6 7'}).addTo(routeLayer);
        continue}
      const pts=bend(a,b,VIA[v].bend);
      L.polyline(pts,{color:t.color,weight:isA?3:2,opacity:op,dashArray:VIA[v].dash,lineCap:'round'}).addTo(routeLayer);
      if(isA)L.marker(pts[20],{interactive:false,keyboard:false,icon:L.divIcon({className:'',iconSize:[22,22],
        html:`<div class="via-ico" title="${VIA[v].name}">${VIA[v].ico}</div>`})}).addTo(routeLayer);}
    t.stops.forEach((s,i)=>{
      const m=L.marker([s.lat,s.lng],{icon:L.divIcon({className:'',iconSize:[24,24],
        html:`<div class="pin${detail&&detail.stopId===s.id?' sel':''}" style="background:${t.color};opacity:${isA?1:.6}">${i+1}</div>`}),zIndexOffset:isA?1000:0})
        .bindTooltip(`${s.name}${s.country?' · '+s.country:''}`).on('click',()=>openDetail(t.id,s.id));
      m.addTo(markerLayer);
    });
  });
}
function render(){
  visitedCache=visited();
  if(countryLayer)countryLayer.setStyle(countryStyle);
  drawMap();
  const t=active();
  // 통계
  let km=0;state.trips.forEach(tr=>{for(let i=1;i<tr.stops.length;i++){const a=tr.stops[i-1],b=tr.stops[i];
    if(viaOf(b)!=='car'){km+=haversine(a,b);continue}const l=legCache[legKey(a,b)];if(l)km+=l.km}});
  $('stats').textContent=`${visitedCache.size}개국 · 여행 ${state.trips.length}개 · 총 ${fmtKm(km)}`;
  // 여행 칩

  state.trips.forEach(tr=>{const b=el('button','chip'+(tr.id===state.activeId?' on':''));

    b.onclick=()=>{state.activeId=tr.id;insertAt=null;legEdit=null;save();render();fitTrip()};$('trips').append(b)});

  if(readOnly()&&!state.trips.length)$('trips').innerHTML='<span class="empty">'+(showLoaded?'아직 공개된 여행이 없어요.':'불러오는 중…')+'</span>';
  const ro=readOnly();
  $('mode-box').hidden=ro;$('edit-box').hidden=ro;$('del-trip').hidden=ro;$('trip-name').readOnly=ro;
  $('tab-show').classList.toggle('on',ro);$('tab-mine').classList.toggle('on',!ro);
  $('tab-show').textContent=OWNER_NAME?OWNER_NAME+'의 여행 기록':'여행 기록';
  renderAccount();
  renderDetail();
  const nv=$('next-via');nv.innerHTML='';
  Object.entries(VIA).forEach(([k,o])=>{const c=el('button','chip'+(k===nextVia?' on':''));c.textContent=`${o.ico} ${o.name}`;
    c.setAttribute('aria-pressed',k===nextVia);c.onclick=()=>{nextVia=k;render()};nv.append(c)});
  $('move-box').hidden=readOnly();
  $('route-banner').hidden=!(routeOffline||Object.keys(legFail).length);
  // 현재 여행
  $('trip-box').hidden=!t;
  $('mode-box').style.display=readOnly()?'none':'flex';
  if(t){
    if(document.activeElement!==$('trip-name'))$('trip-name').value=t.name;
    const ul=$('stops');ul.innerHTML='';
    if(!t.stops.length)ul.innerHTML='<li class="empty">'+(readOnly()?'경유지가 없어요.':'도시를 검색하거나 지도를 눌러 첫 경유지를 추가하세요.')+'</li>';
    t.stops.forEach((s,i)=>{
      if(i>0){const v=viaOf(s),l=v==='car'?legCache[legKey(t.stops[i-1],s)]:null,li=el('li','leg'+(v!=='car'||(l&&l.type==='road')?' road':''));
        const fk=legKey(t.stops[i-1],s),straight=fmtKm(haversine(t.stops[i-1],s));
        const vb=el(readOnly()?'span':'button','via'+(legEdit===i?' on':''));vb.textContent=VIA[v].ico;vb.title=VIA[v].name;
        if(!readOnly()){vb.setAttribute('aria-label',`${i}번→${i+1}번 이동 수단: ${VIA[v].name} (바꾸기)`);vb.onclick=()=>{legEdit=legEdit===i?null:i;render()}}
        li.append(vb);
        const txt=el('span');txt.textContent=v!=='car'?`${VIA[v].name} · 직선 ${straight}`
          :!l&&(routeOffline||legFail[fk])?`도로 경로 못 받음 · 직선 ${straight}`:!l?'도로 경로 계산 중…':l.type==='road'?`도로 ${fmtKm(l.km)} · 약 ${fmtMin(l.min)}`:`도로 없음 · 직선 ${fmtKm(l.km)} · 배나 비행기로 바꿔 보세요`;li.append(txt);
        if(legEdit===i&&!readOnly()){const box=el('div','via-pick');
          Object.entries(VIA).forEach(([k,o])=>{const c=el('button','chip'+(k===v?' on':''));c.textContent=`${o.ico} ${o.name}`;
            c.onclick=()=>{s.via=k;legEdit=null;save();render()};box.append(c)});li.append(box)}
        if(!readOnly()){const b=el('button','ins'+(insertAt===i?' on':''));b.textContent=insertAt===i?'여기에 추가 중':'+ 사이에 추가';
          b.setAttribute('aria-label',`${i}번과 ${i+1}번 사이에 경유지 추가`);
          b.onclick=()=>{insertAt=insertAt===i?null:i;render();if(insertAt!==null){$('q').focus();$('q').scrollIntoView({block:'nearest',behavior:'smooth'});toast(`${i}번과 ${i+1}번 사이에 넣을 도시를 검색하거나 지도를 누르세요.`)}};li.append(b)}
        ul.append(li)}
      const li=el('li','stop');
      li.innerHTML=`<span class="num" style="background:${t.color}">${i+1}</span>
        <div class="nm"><b></b><span></span></div>`;
      li.querySelector('b').textContent=s.name;li.querySelector('span:not(.num)').textContent=s.country||`${s.lat.toFixed(2)}, ${s.lng.toFixed(2)}`;
      [['↑','위로',()=>move(i,-1),i===0],['↓','아래로',()=>move(i,1),i===t.stops.length-1],['×','삭제',()=>{t.stops.splice(i,1);insertAt=null;save();render()},false]]
        .forEach(([s2,lab,fn,dis])=>{if(dis||readOnly())return;const b=el('button','mini');b.textContent=s2;b.setAttribute('aria-label',lab);b.onclick=fn;li.append(b)});
      li.querySelector('.nm').style.cursor='pointer';li.querySelector('.nm').onclick=()=>openDetail(t.id,s.id);

    $('del-trip').textContent=delArmed?'정말 삭제할까요?':'여행 삭제';
    if(insertAt!==null&&insertAt>=t.stops.length)insertAt=null;
    const al=$('add-label');al.innerHTML='';
    if(insertAt===null)al.textContent='경유지 추가';
    else{al.append(`${insertAt}번과 ${insertAt+1}번 사이에 추가 `);const c=el('button','mini');c.textContent='취소';c.onclick=()=>{insertAt=null;render()};al.append(c)}
  }

    const c=el('span','chip');c.innerHTML=`<span class="dot" style="background:var(${v.auto?'--visit':'--manual'})"></span>`;c.append(v.name);cc.append(c)});
  $('hint').textContent=mode==='route'?'지도를 누르면 그 지점이 현재 여행의 다음 경유지로 추가돼요.':'지도에서 나라를 누르면 다녀온 나라로 표시하거나 해제해요. 경로가 지나는 나라는 자동으로 칠해져요.';
}
function move(i,d){insertAt=null;legEdit=null;const s=active().stops;[s[i],s[i+d]]=[s[i+d],s[i]];save();render()}

/* ---------- 기록 옮기기 (내보내기/불러오기) ---------- */
let mvMode='';

let insertAt=null; // 이 위치(배열 인덱스)에 다음 경유지를 끼워 넣음
function addStop(s){let t=active();if(!t){newTrip();t=active()}
  const st={id:uid(),...s,via:nextVia};
  if(insertAt!==null&&insertAt>0&&insertAt<=t.stops.length){t.stops.splice(insertAt,0,st);toast(`${insertAt}번과 ${insertAt+1}번 사이에 ${s.name} 추가`);insertAt=null}
  else{t.stops.push(st);toast(`${s.name} 추가`)}
  save();render();requestAnimationFrame(()=>$('q').scrollIntoView({block:'nearest'}))}

const JONG=['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
function hd(ch){const c=ch?ch.charCodeAt(0)-0xAC00:-1;return c<0||c>11171?null:{cho:Math.floor(c/588),jung:Math.floor(c%588/28),jong:c%28}}
const CITIES=[];
CITY_DATA.trim().split('\n').forEach(line=>{const[country,rest]=line.split('>');
  rest.split('|').forEach(s=>{const[name,en,la,ln,al]=s.split('/');
    CITIES.push({name,en,country,lat:+la,lng:+ln,key:name.replace(/[\s()]/g,''),alt:al?al.split(','):[],enKey:en.toLowerCase().replace(/[\s.'-]/g,'')})})});

/* 한 글자씩 비교: 초성(ㅍ→파리), 입력 중인 마지막 글자(부사→부산, 성→서울)도 인정 */
function prefixHangul(q,name){
  if(!q)return false;
  for(let i=0;i<q.length;i++){const a=q[i],b=name[i],last=i===q.length-1;if(!b)return false;
    if(a===b)continue;
    const ci=CHO.indexOf(a);if(ci>=0){const d=hd(b);if(d&&d.cho===ci)continue;return false}
    if(last){const x=hd(a),y=hd(b);
      if(x&&y&&x.cho===y.cho&&x.jung===y.jung){
        if(x.jong===0)continue;
        const nx=hd(name[i+1]);if(y.jong===0&&nx&&CHO.indexOf(JONG[x.jong])===nx.cho)continue;}}
    return false}
  return true}
const TOP=new Set('서울 부산 제주 도쿄 오사카 교토 후쿠오카 삿포로 오키나와(나하) 베이징 상하이 홍콩 타이베이 방콕 치앙마이 다낭 하노이 호찌민 나트랑 세부 싱가포르 발리 괌 사이판 파리 런던 로마 바르셀로나 마드리드 프라하 빈 부다페스트 뮌헨 베를린 취리히 인터라켄 암스테르담 리스본 이스탄불 두바이 뉴욕 로스앤젤레스 샌프란시스코 라스베이거스 하와이 호놀룰루 밴쿠버 시드니 멜버른 오클랜드'.split(' '));
function suggest(raw){
  const q=raw.replace(/[\s()]/g,''),ql=q.toLowerCase().replace(/[.'-]/g,'');if(!q)return[];
  const out=[];
  CITIES.forEach((c,idx)=>{let sc=-1;
    if(prefixHangul(q,c.key)||c.alt.some(x=>prefixHangul(q,x)))sc=0;
    else if(/^[a-z]/.test(ql)&&c.enKey.startsWith(ql))sc=1;
    else if(q.length>1&&c.key.includes(q))sc=2;
    else if(prefixHangul(q,c.country.replace(/\s/g,'')))sc=3;
    if(sc>=0)out.push({c,sc,idx})});
  return out.sort((a,b)=>a.sc-b.sc||(TOP.has(b.c.name)-TOP.has(a.c.name))||a.idx-b.idx).slice(0,8).map(o=>o.c)}

function drawResults(list,remote,raw){

  }catch(err){toast('지도 검색에 실패했어요. 인터넷 연결을 확인해 주세요.');closeResults()}}
function onType(){const raw=$('q').value;clearTimeout(qTimer);
  if(!raw.trim()){closeResults();return}
  const list=suggest(raw);drawResults(list,false,raw);
  if(!list.length&&raw.trim().length>=2)qTimer=setTimeout(()=>{if($('q').value===raw)remoteSearch(raw.trim())},700)}
$('q').addEventListener('input',onType);
$('more').addEventListener('pointerdown',e=>e.preventDefault());
$('more').onclick=()=>{const q=$('q').value.trim();

$('q').addEventListener('compositionupdate',()=>setTimeout(onType,0));
$('q').addEventListener('focus',()=>{if($('q').value.trim())onType()});
$('q').addEventListener('blur',()=>setTimeout(closeResults,150));
$('q').addEventListener('keydown',e=>{
  if(e.isComposing&&e.key==='Enter')return;
  const btns=[...$('results').querySelectorAll('button')];
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){if(!btns.length)return;e.preventDefault();
    activeIdx=(activeIdx+(e.key==='ArrowDown'?1:-1)+btns.length)%btns.length;
    btns.forEach((b,i)=>b.classList.toggle('act',i===activeIdx));btns[activeIdx].scrollIntoView({block:'nearest'})}
  else if(e.key==='Enter'){e.preventDefault();if(btns[activeIdx])btns[activeIdx].click();else if($('q').value.trim())remoteSearch($('q').value.trim())}
  else if(e.key==='Escape')closeResults()});

map.on('click',async e=>{

/* ---------- 기타 ---------- */
function $(id){return document.getElementById(id)}
function el(tag,cls){const e=document.createElement(tag);if(cls)e.className=cls;return e}
let tt;function toast(m){const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2600)}
$('mode-route').onclick=()=>{mode='route';$('mode-route').classList.add('on');$('mode-country').classList.remove('on');render()};
$('mode-country').onclick=()=>{mode='country';$('mode-country').classList.add('on');$('mode-route').classList.remove('on');render()};
$('fold').onclick=()=>{const p=$('panel');p.classList.toggle('collapsed');$('fold').textContent=p.classList.contains('collapsed')?'펼치기':'접기'};
/* ---------- 경유지 사진 ---------- */
let detail=null; // {tripId, stopId}
function detailStop(){if(!detail)return null;const t=state.trips.find(x=>x.id===detail.tripId);
  const i=t?t.stops.findIndex(x=>x.id===detail.stopId):-1;return i<0?null:{t,s:t.stops[i],i}}
function openDetail(tripId,stopId){detail={tripId,stopId};state.activeId=tripId;
  $('panel').classList.remove('collapsed');$('fold').textContent='접기';
  const d=detailStop();if(d)map.panTo([d.s.lat,d.s.lng]);render();$('panel').querySelector('.body').scrollTop=0}
$('d-back').onclick=()=>{detail=null;render()};
let uploading=null; // {done,total}
const urlCache={};
async function photoURL(p){
  if(p.path)return sb?sb.storage.from('photos').getPublicUrl(p.path).data.publicUrl:null;
  if(urlCache[p.id])return urlCache[p.id];
  const blob=await idbGet(p.id);if(!blob)return null;return urlCache[p.id]=URL.createObjectURL(blob)}
function renderDetail(){
  const d=detailStop();$('detail').hidden=!d;$('main').hidden=!!d;if(!d){detail=null;return}
  const{t,s,i}=d,ro=readOnly(),photos=s.photos||[];
  $('d-num').textContent=i+1;$('d-num').style.background=t.color;
  $('d-name').textContent=s.name;$('d-sub').textContent=[s.country,t.name].filter(Boolean).join(' · ');
  $('d-count').textContent=photos.length?`사진 ${photos.length}장`:'사진';
  const g=$('d-grid');g.innerHTML='';
  photos.forEach((p,k)=>{const w=el('div','tile-wrap'),b=el('button','tile');b.setAttribute('aria-label',`${s.name} 사진 ${k+1} 크게 보기`);w.append(b);g.append(w);
    photoURL(p).then(u=>{if(u){const im=el('img');im.loading='lazy';im.alt='';im.src=u;b.append(im)}
      else{b.className='tile missing';b.textContent=p.path?'서버 설정 후 보여요':'다른 기기에 저장된 사진'}});
    b.onclick=()=>openLB(k);
    if(!ro){const x=el('button','tile-x'+(delArmId===p.id?' armed':''));x.textContent=delArmId===p.id?'삭제':'×';
      x.setAttribute('aria-label',delArmId===p.id?'한 번 더 누르면 삭제':`사진 ${k+1} 삭제`);
      x.onclick=ev=>{ev.stopPropagation();
        if(delArmId!==p.id){delArmId=p.id;clearTimeout(delArmT);delArmT=setTimeout(()=>{delArmId=null;renderDetail()},3000);renderDetail();return}
        delArmId=null;deletePhoto(s,p.id)};w.append(x)}});
  if(uploading){const b=el('div','tile busy');b.textContent=`올리는 중 ${uploading.done}/${uploading.total}`;g.append(b)}
  if(!ro){const a=el('button','tile add');a.innerHTML='+<small>사진 추가</small>';a.onclick=()=>$('d-file').click();g.append(a);
    const h=el('div','drop-hint');h.textContent='PC에서는 사진 파일을 이 칸으로 끌어다 놓아도 돼요.';g.append(h)}
  if(ro&&!photos.length){const e=el('div','empty');e.textContent='아직 사진이 없어요.';e.style.gridColumn='1/-1';g.append(e)}
}
/* 사진 줄이기: 긴 변 1600px JPEG */
async function shrink(file){
  const img=await new Promise((ok,no)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{ok(im);URL.revokeObjectURL(u)};im.onerror=no;im.src=u});
  const k=Math.min(1,1600/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement('canvas');
  c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  return new Promise(ok=>c.toBlob(ok,'image/jpeg',.85))}
$('d-file').onchange=e=>{const files=[...e.target.files];e.target.value='';uploadFiles(files)};
async function uploadFiles(files){
  files=files.filter(f=>/^image\//.test(f.type)||/\.(jpe?g|png|gif|webp|heic|heif)$/i.test(f.name));
  const d=detailStop();if(!d||readOnly())return;if(!files.length){toast('사진 파일만 추가할 수 있어요.');return}
  const stop=d.s;stop.photos=stop.photos||[];uploading={done:0,total:files.length};render();
  let fail=0;
  for(const f of files){
    try{const blob=await shrink(f),id=uid()+uid();
      if(sb&&session){const path=`${session.user.id}/${id}.jpg`;
        const{error}=await sb.storage.from('photos').upload(path,blob,{contentType:'image/jpeg'});if(error)throw error;
        stop.photos.push({id,path})}
      else{await idbPut(id,blob);stop.photos.push({id,local:true})}
      save()}catch(err){fail++}
    uploading.done++;renderDetail()}
  uploading=null;render();
  if(fail)toast(`${fail}장은 올리지 못했어요. 사진 형식이나 연결을 확인해 주세요.`);
  else if(!session)toast('로그인 전이라 사진이 이 기기에만 저장됐어요.')}

/* PC: 사진 파일을 사진 칸으로 끌어다 놓기 */
let dragDepth=0;
const hasFiles=e=>e.dataTransfer&&[...e.dataTransfer.types].includes('Files');
$('detail').addEventListener('dragenter',e=>{if(!hasFiles(e)||readOnly())return;e.preventDefault();dragDepth++;$('detail').classList.add('dropping')});
$('detail').addEventListener('dragover',e=>{if(!hasFiles(e)||readOnly())return;e.preventDefault();e.dataTransfer.dropEffect='copy'});
$('detail').addEventListener('dragleave',()=>{if(--dragDepth<=0){dragDepth=0;$('detail').classList.remove('dropping')}});
$('detail').addEventListener('drop',e=>{if(!hasFiles(e))return;e.preventDefault();dragDepth=0;$('detail').classList.remove('dropping');uploadFiles([...e.dataTransfer.files])});
// 칸 밖에 잘못 떨어뜨려도 브라우저가 사진 파일을 열어버리지 않게
addEventListener('dragover',e=>{if(hasFiles(e))e.preventDefault()});
addEventListener('drop',e=>{if(hasFiles(e)){e.preventDefault();if(detail&&!readOnly())toast('사진 칸 위에 놓아 주세요.')}});

/* 크게 보기 */
let lbIdx=0,lbDelArm=false;
function openLB(k){lbIdx=k;lbDelArm=false;$('lb').hidden=false;showLB()}
async function showLB(){const d=detailStop();const ps=d&&d.s.photos||[];if(!ps.length){$('lb').hidden=true;return}
  lbIdx=(lbIdx+ps.length)%ps.length;$('lb-img').src=await photoURL(ps[lbIdx])||'';
  $('lb-pos').textContent=`${lbIdx+1} / ${ps.length}`;$('lb-del').hidden=readOnly();
  $('lb-del').textContent=lbDelArm?'정말 삭제할까요?':'사진 삭제';
  $('lb-prev').hidden=$('lb-next').hidden=ps.length<2}
$('lb-close').onclick=()=>{$('lb').hidden=true};
$('lb').onclick=e=>{if(e.target===$('lb'))$('lb').hidden=true};
$('lb-prev').onclick=()=>{lbIdx--;lbDelArm=false;showLB()};
$('lb-next').onclick=()=>{lbIdx++;lbDelArm=false;showLB()};
document.addEventListener('keydown',e=>{if($('lb').hidden)return;
  if(e.key==='Escape')$('lb').hidden=true;if(e.key==='ArrowLeft')$('lb-prev').click();if(e.key==='ArrowRight')$('lb-next').click()});
let delArmId=null,delArmT=null;
async function deletePhoto(stop,id){const k=(stop.photos||[]).findIndex(x=>x.id===id);if(k<0)return;
  const[p]=stop.photos.splice(k,1);save();render();toast('사진을 삭제했어요.');
  try{if(p.path&&sb)await sb.storage.from('photos').remove([p.path]);if(p.local)await idbDel(p.id)}catch(err){}}
$('lb-del').onclick=async()=>{if(!lbDelArm){lbDelArm=true;showLB();return}
  const d=detailStop();const p=d.s.photos[lbIdx];lbDelArm=false;await deletePhoto(d.s,p.id);showLB()};

/* 이 기기 저장소 (로그인 전 사진) */
function idb(){return new Promise((ok,no)=>{const r=indexedDB.open('roadbook-photos',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('p');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
async function idbOp(mode,fn){const db=await idb();return new Promise((ok,no)=>{const tx=db.transaction('p',mode),q=fn(tx.objectStore('p'));
  tx.oncomplete=()=>ok(q&&q.result);tx.onerror=()=>no(tx.error)})}
const idbPut=(k,v)=>idbOp('readwrite',st=>st.put(v,k));
const idbGet=k=>idbOp('readonly',st=>st.get(k)).catch(()=>null);
const idbDel=k=>idbOp('readwrite',st=>st.delete(k));

/* ---------- 탭 ---------- */
function setTab(t){tab=t;insertAt=null;legEdit=null;detail=null;state=t==='show'?showState:myState;mode='route';
  $('mode-route').classList.add('on');$('mode-country').classList.remove('on');closeResults();
  render();fitTrip();if(t==='show')loadShow()}
$('tab-show').onclick=()=>setTab('show');
$('tab-mine').onclick=()=>setTab('mine');

/* ---------- 서버 (Supabase) ---------- */
let sb=null,session=null,syncText='',authMsg='',saveTimer=null;
/* URL을 조금 다르게 넣어도 https://xxxx.supabase.co 형태로 고쳐서 사용 */
function cleanSbUrl(u){u=(u||'').trim();
  const dash=u.match(/supabase\.com\/dashboard\/project\/([a-z0-9]+)/i);if(dash)return`https://${dash[1]}.supabase.co`;
  const m=u.match(/^(?:https?:\/\/)?([a-z0-9]+)\.supabase\.co/i);if(m)return`https://${m[1]}.supabase.co`;
  return u.replace(/\/+$/,'')}
if(SUPABASE_URL&&SUPABASE_KEY&&window.supabase)sb=window.supabase.createClient(cleanSbUrl(SUPABASE_URL),SUPABASE_KEY.trim());
async function loadShow(){
  if(!sb||!OWNER_ID){showState=clone(SAMPLE);showLoaded=true}
  else{const{data,error}=await sb.from('maps').select('data').eq('user_id',OWNER_ID).maybeSingle();
    showLoaded=true;if(error){toast('여행 기록을 불러오지 못했어요.');return}
    showState=data&&data.data&&data.data.trips?data.data:clone(EMPTY)}
  if(!showState.trips.find(t=>t.id===showState.activeId))showState.activeId=showState.trips[0]&&showState.trips[0].id;
  if(tab==='show'){state=showState;render();fitTrip()}
}
const pendKey=()=>'roadbook-pending-'+(session?session.user.id:'');
async function pushCloud(){if(!session)return;clearTimeout(saveTimer);saveTimer=null;
  const{error}=await sb.from('maps').upsert({user_id:session.user.id,data:myState,is_public:session.user.id===OWNER_ID,updated_at:new Date().toISOString()});
  if(!error)try{localStorage.removeItem(pendKey())}catch(e){}
  if(error)console.warn('저장 실패',error);
  syncText=!error?'저장됨':/relation .*does not exist|Could not find the table|schema cache/i.test(error.message||'')?'저장 실패 · 서버에 maps 표가 없어요. supabase_setup.sql을 실행해 주세요.'
    :/is_public|column/i.test(error.message||'')?'저장 실패 · maps 표의 칸이 달라요. supabase_setup.sql로 다시 만들어 주세요.'
    :/row-level security|permission denied/i.test(error.message||'')?'저장 실패 · 저장 권한 설정이 빠졌어요. supabase_setup.sql을 실행해 주세요.'
    :/JWT|token/i.test(error.message||'')?'저장 실패 · 로그인이 만료됐어요. 로그아웃 후 다시 로그인해 주세요.'
    :`저장 실패 (이 기기에는 보관 중) · ${error.message||error.code||'연결 오류'}`;
  renderAccount()}
/* 창을 닫거나 다른 앱으로 넘어가는 순간 기다리던 저장을 바로 보냄 */
function flushSave(){if(saveTimer&&session)pushCloud()}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushSave()});
addEventListener('pagehide',flushSave);
function scheduleCloud(){syncText='저장 중…';renderAccount();clearTimeout(saveTimer);saveTimer=setTimeout(pushCloud,800)}
async function onSession(s){
  const prev=session&&session.user.id;session=s;
  if(!s){if(prev){myState=load(KEY)||clone(SAMPLE);if(tab==='mine'){state=myState;render()}}renderAccount();return}
  if(prev===s.user.id){renderAccount();return}
  syncText='불러오는 중…';renderAccount();
  const{data,error}=await sb.from('maps').select('data').eq('user_id',s.user.id).maybeSingle();
  if(error){syncText='불러오기 실패';renderAccount();return}
  const pend=load(pendKey()); // 지난번에 서버로 못 보낸 기록이 이 기기에 남아 있으면 그걸 이어서 올림
  if(pend&&pend.trips){myState=pend;await pushCloud()}
  else if(data&&data.data&&data.data.trips){myState=data.data;syncText='저장됨'}
  else{await pushCloud()} // 처음 로그인: 이 기기의 기록을 올림
  if(tab==='mine'){state=myState;render();fitTrip()}else renderAccount();
}
if(sb)sb.auth.onAuthStateChange((ev,s)=>{setTimeout(()=>onSession(s),0)});
const AUTH_ERR=m=>/Invalid login/i.test(m)?'이메일 또는 비밀번호가 맞지 않아요.':/already registered/i.test(m)?'이미 가입된 이메일이에요. 로그인을 눌러 주세요.':
  /least 6|Password should/i.test(m)?'비밀번호는 6자 이상이어야 해요.':/valid email|invalid format/i.test(m)?'이메일 주소 형식을 확인해 주세요.':/Invalid path/i.test(m)?'서버 주소(SUPABASE_URL)가 잘못됐어요. https://영문.supabase.co 형태로만 넣어 주세요.':/Invalid API key|No API key/i.test(m)?'서버 키(SUPABASE_KEY)가 잘못됐어요. Publishable 또는 anon 키를 넣어 주세요.':/not confirmed/i.test(m)?'이메일 인증이 필요한 설정이에요. 서버에서 Confirm email을 꺼 주세요.':m;
async function auth(kind){
  const email=$('ac-email').value.trim(),password=$('ac-pw').value;
  if(!email||!password){authMsg='이메일과 비밀번호를 입력해 주세요.';renderAccount();return}
  authMsg=kind==='up'?'가입하는 중…':'로그인하는 중…';renderAccount();
  const r=kind==='up'?await sb.auth.signUp({email,password}):await sb.auth.signInWithPassword({email,password});
  if(r.error){authMsg=AUTH_ERR(r.error.message);renderAccount();return}
  if(kind==='up'&&!r.data.session){authMsg='가입은 됐지만 이메일 인증이 켜져 있어요. 서버에서 Confirm email을 꺼 주세요.';renderAccount();return}
  authMsg='';
}
let acKey='';
function renderAccount(){
  const box=$('account');box.hidden=readOnly();if(readOnly())return;
  const key=!sb?'none':!session?'login':'in:'+session.user.id;
  if(key===acKey){ // 입력 중인 칸은 그대로 두고 문구만 갱신
    const m=$('ac-msg');if(m)m.textContent=authMsg;const y=box.querySelector('.sync');if(y)y.textContent=syncText;return}
  acKey=key;
  const keepEmail=$('ac-email')?$('ac-email').value:'';
  if(!sb){box.innerHTML='<div class="note">서버 설정 전이라 기록이 이 기기의 브라우저에만 저장돼요.</div>';return}
  if(!session){
    box.innerHTML=`<div class="note">로그인하면 어느 기기에서 열어도 내 지도가 그대로 보여요. 로그인하지 않으면 이 기기에만 저장돼요.</div>
      <input id="ac-email" type="email" placeholder="이메일" autocomplete="username">
      <input id="ac-pw" type="password" placeholder="비밀번호 (6자 이상)" autocomplete="current-password">
      <div class="row"><button class="primary" id="ac-in">로그인</button><button class="iconbtn" id="ac-up">처음이면 가입하기</button></div>
      <div class="note" id="ac-msg"></div>`;
    $('ac-email').value=keepEmail;$('ac-msg').textContent=authMsg;
    $('ac-in').onclick=()=>auth('in');$('ac-up').onclick=()=>auth('up');
    $('ac-pw').onkeydown=e=>{if(e.key==='Enter')auth('in')};
    return}
  const isOwner=session.user.id===OWNER_ID;
  box.innerHTML=`<div class="who"><b></b><span class="sync"></span><span style="flex:1"></span><button class="iconbtn" id="ac-out">로그아웃</button></div>
    <div class="note">${isOwner?'이 지도가 ‘여행 기록’ 탭에 공개돼요.':'내 지도는 나만 볼 수 있어요.'}</div>
    ${OWNER_ID?'':'<div class="note">‘여행 기록’ 탭 설정용 내 ID:</div><div class="uid"></div>'}`;
  box.querySelector('b').textContent=session.user.email;box.querySelector('.sync').textContent=syncText;
  const u=box.querySelector('.uid');if(u)u.textContent=session.user.id;
  $('ac-out').onclick=async()=>{clearTimeout(saveTimer);await sb.auth.signOut()};
}

state=showState;render();loadShow();
</script>
